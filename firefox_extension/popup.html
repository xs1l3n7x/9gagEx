<!DOCTYPE html>
<html>
<head>
  <title>9gagEx</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 10px;
      width: 250px;
    }
    input, button {
      width: 100%;
      padding: 8px;
      margin: 5px 0;
      box-sizing: border-box;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <h2>Discriminate!</h2>
  <label for="forbiddenTitleWords">Forbidden Title Words (comma-separated):</label>
  <input type="text" id="forbiddenTitleWords" placeholder="e.g., ukraine, palestine, israel">

  <label for="forbiddenTags">Forbidden Tags (comma-separated):</label>
  <input type="text" id="forbiddenTags" placeholder="e.g., politics, war">

  <button id="applyButton">Apply Filters</button>

  <script src="popup.js"></script>
</body>
</html>
